[project]
name = "rag"
version = "0.1.0"
description = "RAG Evaluation and Ingestion Benchmark Suite"
readme = "README.md"
requires-python = ">=3.13.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "mcp>=2.1.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "python-multipart>=0.0.20",
    "rich>=15.0.0",
    "ruff>=0.16.3",
    "sentence-transformers>=6.0.1",
    "torch>=2.13.0",
    "tqdm>=4.67.1",
    "ty>=0.0.74",
    "typer>=0.27.1",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.uv]
package = true

[project.scripts]
rag-eval = "rag_eval.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow' -n 2"

[tool.ruff]
extend-exclude = [".agents"]
