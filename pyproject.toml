[project]
name = "rag"
version = "0.1.0"
description = "RAG Evaluation and Ingestion Benchmark Suite"
readme = "README.md"
requires-python = ">=3.13.11"
dependencies = [
    "datasets>=5.0.1",
    "fastembed>=0.8.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "ruff>=0.16.3",
    "torch>=2.13.0",
    "tqdm>=4.67.1",
    "transformers>=5.15.0",
    "ty>=0.0.74",
    "typer>=0.27.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.uv]
package = true

[project.scripts]
rag-eval = "rag_eval.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"
