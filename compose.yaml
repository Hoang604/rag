services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_legal_postgres
    restart: unless-stopped
    ports:
      # 15432, not something in the 49152+ range. Windows reserves blocks of
      # ephemeral ports for Hyper-V/WinNAT and the blocks move between boots:
      # the previous choice, 54329, landed inside a reserved range one morning
      # and Docker could no longer bind it ("An attempt was made to access a
      # socket in a way forbidden by its access permissions"). Freeing it needs
      # `net stop winnat` as administrator. A port below the dynamic range is
      # never taken this way.
      #   netsh interface ipv4 show excludedportrange protocol=tcp
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_legal
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=1536MB
      -c max_connections=100
      -c max_parallel_workers_per_gather=2
      -c max_parallel_maintenance_workers=2
      -c hnsw.ef_search=200
    # The default 64 MB is too small for the shared segment a parallel
    # REINDEX of the HNSW index asks for.
    shm_size: 1gb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_legal"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
    driver: local
